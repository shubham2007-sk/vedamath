details.card summary{cursor:pointer;list-style:none}details.card[open]{border-color:var(--pri2)}details.card .tip{margin:8px 0;padding:8px 10px;border-radius:10px;background:var(--bg)}
.trick{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-left:6px solid var(--pri2)}

<script>
const BRAND={name:'VedaMath',tag:'Think Faster. Calculate Smarter.'}; // change here
const $=s=>document.querySelector(s),E=h=>{$('#app').innerHTML=h};
/* ---------- progress store (localStorage, shape ready for a DB) ---------- */
const blank=()=>({xp:0,solved:0,correct:0,best:null,streak:0,longest:0,last:'',days:[],done:{},skill:{},bestScore:{},perfect:false,dailyDone:''});
let S=blank();try{S=Object.assign(blank(),JSON.parse(localStorage.getItem('vm_v1')))}catch(e){}
const save=()=>{try{localStorage.setItem('vm_v1',JSON.stringify(S))}catch(e){}};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
function touch(){const t=today();if(S.last===t)return;const y=new Date();y.setDate(y.getDate()-1);S.streak=S.last===ymd(y)?S.streak+1:1;if(S.streak%7===0)S.xp+=200;S.longest=Math.max(S.longest,S.streak);S.last=t;S.days.push(t)}
const LV=[[0,'Beginner'],[100,'Learner'],[300,'Calculator Challenger'],[600,'Mental Math Explorer'],[1000,'Speed Solver'],[1500,'Math Master']];
const lvl=()=>{let i=0;LV.forEach((l,k)=>{if(S.xp>=l[0])i=k});return i};
/* ---------- question engine (add a generator to G + CAT to extend) ---------- */
let R=Math.random;const ri=(a,b)=>a+Math.floor(R()*(b-a+1)),p2=n=>String(n).padStart(2,'0');
function seeded(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}let a=h>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const mk=(c,q,a,hint,steps)=>({question:q,correctAnswer:a,category:c,hint,steps,explanation:steps.join(' → ')});
const G={
comp10:d=>{const n=ri(1,9);return mk('comp10',`10 − ${n}`,10-n,'What do you add to '+n+' to reach 10?',[`${n} + ? = 10`,`? = ${10-n}`])},
comp100:d=>{const n=ri(1,99);return mk('comp100',`100 − ${n}`,100-n,'Make each digit sum to 9, the last digit to 10.',[`Tens: 9 − ${Math.floor(n/10)} = ${9-Math.floor(n/10)}`,`Units: 10 − ${n%10} = ${10-n%10}`,`Answer: ${100-n}`])},
add:d=>{const m=d<3?2:d<5?3:4,lo=10**(m-1),a=ri(lo,lo*10-1),b=ri(lo,lo*10-1),bu=b%10;return mk('add',`${a} + ${b}`,a+b,'Add the big parts of the second number first, then the units.',[`Split: ${b} = ${b-bu} + ${bu}`,`${a} + ${b-bu} = ${a+b-bu}`,`${a+b-bu} + ${bu} = ${a+b}`])},
sub:d=>{const m=d<3?2:d<5?3:4,lo=10**(m-1),a=ri(lo*2,lo*10-1),b=ri(lo,a-1),bu=b%10;return mk('sub',`${a} − ${b}`,a-b,'Subtract the round part first, then the units.',[`Split: ${b} = ${b-bu} + ${bu}`,`${a} − ${b-bu} = ${a-b+bu}`,`${a-b+bu} − ${bu} = ${a-b}`])},
mul5:d=>{const n=ri(12,d<3?99:d<5?499:2999);return mk('mul5',`${n} × 5`,n*5,'×5 is ×10 then halve.',[`${n} × 10 = ${n*10}`,`Half of ${n*10} = ${n*5}`])},
mul11:d=>{const n=d<3?ri(12,98):ri(101,999),s=String(n);let st;if(n<100){const a=+s[0],b=+s[1];st=[`Keep the outer digits: ${a} _ ${b}`,`Add them: ${a}+${b} = ${a+b}`,`Place in the middle (carry if 10+): ${n*11}`]}else st=[`${n} × 11 = ${n} × 10 + ${n}`,`${n*10} + ${n} = ${n*11}`];return mk('mul11',`${n} × 11`,n*11,'Keep the outer digits; the middle is the sum of neighbours.',st)},
mul25:d=>{const n=ri(12,d<3?99:d<5?399:1999);return mk('mul25',`${n} × 25`,n*25,'×25 is ×100 then ÷4.',[`${n} × 100 = ${n*100}`,`${n*100} ÷ 4 = ${n*25}`])},
mul50:d=>{const n=ri(12,d<3?99:d<5?399:1999);return mk('mul50',`${n} × 50`,n*50,'×50 is ×100 then ÷2.',[`${n} × 100 = ${n*100}`,`${n*100} ÷ 2 = ${n*50}`])},
near100:d=>{const x=ri(1,[4,7,9,9,9][d-1]),y=ri(1,[4,7,9,9,9][d-1]),a=100-x,b=100-y;return mk('near100',`${a} × ${b}`,a*b,'Think about how far both numbers are from 100.',[`${a} = 100 − ${x}, ${b} = 100 − ${y}`,`Cross-subtract: ${a} − ${y} = ${a-y}`,`Multiply the gaps: ${x} × ${y} = ${x*y}`,`Join: ${a-y} | ${p2(x*y)} = ${a*b}`])},
sq5:d=>{const k=ri(1,d<3?9:d<5?19:29),n=10*k+5;return mk('sq5',`${n}²`,n*n,'Multiply the leading digits by the next number, then attach 25.',[`Leading part: ${k}`,`${k} × ${k+1} = ${k*(k+1)}`,`Attach 25: ${k*(k+1)}25 = ${n*n}`])},
sqnear100:d=>{const n=d<4?ri(91,99):ri(101,109),x=Math.abs(100-n);return mk('sqnear100',`${n}²`,n*n,'Use the distance from 100: n ± gap, then gap².',[`Gap from 100: ${x}`,`${n} ${n<100?'−':'+'} ${x} = ${2*n-100}`,`Gap squared: ${x}² = ${p2(x*x)}`,`Join: ${2*n-100} | ${p2(x*x)} = ${n*n}`])},
div:d=>{const m=d<3?[3,9][ri(0,1)]:[3,9,11][ri(0,2)],n=ri(100,d<3?999:9999),ds=[...String(n)].map(Number);let a,st;if(m===11){const alt=ds.reduceRight((s,v,i)=>s+(((ds.length-1-i)%2)?-v:v),0);a=((alt%11)+11)%11;st=[`Alternating digit sum (from the right): ${alt}`,`${alt} mod 11 = ${a}`]}else{const sum=ds.reduce((x,y)=>x+y,0);a=sum%m;st=[`Digit sum: ${ds.join(' + ')} = ${sum}`,`${sum} mod ${m} = ${a}`]}return mk('div',`Remainder of ${n} ÷ ${m}`,a,m===11?'Alternate + and − across the digits.':'Add the digits, then find the remainder of that sum.',st)},
div5:d=>{const n=5*ri(4,d<3?40:200);return mk('div5',`${n} ÷ 5`,n/5,'÷5 is ×2 then ÷10.',[`${n} × 2 = ${n*2}`,`${n*2} ÷ 10 = ${n/5}`])},
pct:d=>{const p=[10,20,25,50,5,15][ri(0,d<3?3:5)],b=ri(2,d<3?10:40)*20;return mk('pct',`${p}% of ${b}`,p*b/100,'Find 1% (or 10%) first, then scale.',[`1% of ${b} = ${b/100}`,`${p} × ${b/100} = ${p*b/100}`])},
frac:d=>{const dn=[2,4,5,8,10][ri(0,d<3?2:4)],nu=ri(1,dn-1),b=dn*ri(2,d<3?12:30);return mk('frac',`${nu}/${dn} of ${b}`,nu*b/dn,'Divide by the bottom, then multiply by the top.',[`${b} ÷ ${dn} = ${b/dn}`,`${b/dn} × ${nu} = ${nu*b/dn}`])}};
const GRP={comp10:'addition',comp100:'addition',add:'addition',sub:'subtraction',mul5:'multiplication',mul11:'multiplication',mul25:'multiplication',mul50:'multiplication',near100:'multiplication',sq5:'squares',sqnear100:'squares',div:'division',div5:'division',pct:'percentages',frac:'percentages'};
const TOPICS={Addition:['add','comp10','comp100'],Subtraction:['sub','comp100'],Multiplication:['mul5','mul11','mul25','mul50','near100'],Division:['div','div5'],Squares:['sq5','sqnear100'],Percentages:['pct','frac'],Mixed:Object.keys(G)};
const DN=['beginner','easy','medium','hard','master'];
function genSet(cats,d,n){const out=[],seen=new Set();for(let k=0;out.length<n&&k<n*30;k++){const q=G[cats[ri(0,cats.length-1)]](d);if(seen.has(q.question))continue;seen.add(q.question);q.difficulty=DN[d-1];out.push(q)}return out}
/* ---------- lessons ---------- */
const LN=['','Foundations','Multiplication','Squares & Cubes','Division','Advanced'];
const LS=[['comp10','Complements to 10',1,1,3,'A complement is the number that tops another up to a round base. 7 and 3 are complements to 10.','Round numbers are easy to work with. Spotting complements lets you regroup: 7 + 5 = 7 + 3 + 2 = 12.'],
['comp100','Complements to 100',1,1,4,'Find what must be added to reach 100: subtract each digit from 9, and the last digit from 10.','100 − n = 99 − n + 1. Subtracting from 99 never needs borrowing, then the +1 fixes the last digit.'],
['add','Fast Addition',1,2,5,'Add left-to-right in chunks instead of column by column.','Place value lets you split a number: a + 346 = a + 300 + 40 + 6. Partial sums stay small and easy.'],
['sub','Fast Subtraction',1,2,5,'Subtract the round part of the number first, then adjust with the units.','a − 47 = a − 50 + 3, or a − 40 − 7. Round numbers avoid borrowing.'],
['mul5','Multiplication by 5',2,1,3,'To multiply by 5, multiply by 10 and halve the result.','5 = 10 ÷ 2, so n × 5 = n × 10 ÷ 2.'],
['mul11','Multiplication by 11',2,2,5,'For a two-digit number, keep the outer digits and put their sum in the middle.','n × 11 = n × 10 + n. Adding a number to its shifted copy places neighbouring digit sums in the middle.'],
['mul25','Multiplication by 25',2,2,4,'To multiply by 25, multiply by 100 then divide by 4.','25 = 100 ÷ 4, so n × 25 = n × 100 ÷ 4.'],
['mul50','Multiplication by 50',2,1,3,'To multiply by 50, multiply by 100 then halve.','50 = 100 ÷ 2, so n × 50 = n × 100 ÷ 2.'],
['near100','Numbers Near 100',2,3,8,'When both numbers are slightly below 100, use how far each is from 100.','(100−x)(100−y) = 100(100−x−y) + xy. Note 100−x−y equals a−y, which is the cross-subtraction.'],
['sq5','Squares Ending in 5',3,2,5,'Multiply the leading digits by the next whole number, then write 25 after it.','(10k+5)² = 100k(k+1) + 25. The k(k+1) shifts two places and 25 fills the end.'],
['sqnear100','Squares Near 100',3,3,7,'Use the distance x from 100: write (n ± x) then x² as a two-digit block.','(100−x)² = 100(100−2x) + x². And 100 − 2x equals n − x for numbers below 100.'],
['div','Divisibility & Remainders',4,3,8,'A number and its digit sum leave the same remainder when divided by 3 or 9. For 11, alternate + and − across the digits.','Every power of 10 is one more than a multiple of 9, so n ≡ digit sum (mod 9). For 11, powers of 10 alternate between +1 and −1.'],
['pct','Fast Percentages',5,2,6,'Find 1% or 10% by moving the decimal point, then build up to the percentage.','p% of n = p × (n ÷ 100). 10%, 5% and 1% are quick building blocks.'],
['frac','Fast Fractions',5,3,6,'To find a/b of a number, divide by the bottom (b) then multiply by the top (a).','a/b × n = (n ÷ b) × a. Dividing first keeps numbers small.']].map(l=>({id:l[0],t:l[1],lv:l[2],d:l[3],time:l[4],intro:l[5],why:l[6],xp:50}));
/* ---------- helpers ---------- */
const bar=p=>`<div class="bar" role="progressbar" aria-valuenow="${Math.round(p)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>`;
const diff=d=>`<span class="badge">${['','Beginner','Easy','Medium','Hard','Master'][d]}</span>`;
function animate(el,steps,gap=850){if(!el)return;el.innerHTML=steps.map(s=>`<div class="step">${s}</div>`).join('');[...el.children].forEach((c,i)=>setTimeout(()=>c.classList.add('in'),250+i*gap))}

function beep(f,d,t='sine',v=.08,delay=0){if(MUTE)return;try{AC_=AC_||new(window.AudioContext||window.webkitAudioContext)();const o=AC_.createOscillator(),g=AC_.createGain(),s=AC_.currentTime+delay;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC_.destination);o.start(s);o.stop(s+d)}catch(e){}}

const root=document.documentElement,cv=document.createElement('canvas');cv.id='sky';cv.setAttribute('aria-hidden','true');document.body.prepend(cv);
const cx=cv.getContext('2d'),RM=matchMedia('(prefers-reduced-motion: reduce)').matches,SYM=['+','−','×','÷','=','%','√','π','∑','∞','7','3','9','12','25','100','11','5','²','½','42','99','8','64','√2','x²'];
let W=0,H=0,stars=[],nums=[],shoot=null,nextShoot=200,fr=0;
const isDark=()=>root.dataset.theme==='dark'||(root.dataset.theme!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
const rnd=(a,b)=>a+Math.random()*(b-a);
function sizeSky(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
 stars=Array.from({length:Math.min(170,Math.round(W*H/8000))},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(.4,1.9),p:rnd(0,6.28),s:rnd(.015,.05)}));
 nums=Array.from({length:Math.min(28,Math.round(W/42))},()=>({x:rnd(0,W),y:rnd(0,H),t:SYM[Math.floor(Math.random()*SYM.length)],f:rnd(16,44),vy:-rnd(.12,.45),vx:rnd(-.15,.15),a:rnd(.07,.2),rot:rnd(-.5,.5),vr:rnd(-.002,.002)}));if(RM)drawSky()}
function drawSky(){cx.clearRect(0,0,W,H);const dk=isDark(),sc=dk?'255,255,255':'109,40,217',nc=dk?'165,180,255':'79,70,229';fr++;
 for(const n of nums){n.x+=n.vx;n.y+=n.vy;n.rot+=n.vr;if(n.y<-60){n.y=H+40;n.x=rnd(0,W);n.t=SYM[Math.floor(Math.random()*SYM.length)]}
  cx.save();cx.translate(n.x,n.y);cx.rotate(n.rot);cx.font='700 '+n.f+'px ui-monospace,Menlo,monospace';cx.fillStyle='rgba('+nc+','+(dk?n.a:n.a*.8)+')';if(dk){cx.shadowColor='rgba(129,140,248,.6)';cx.shadowBlur=12}cx.fillText(n.t,0,0);cx.restore()}
 for(const s of stars){s.p+=s.s;const tw=.25+.75*Math.abs(Math.sin(s.p)),a=(dk?1:.55)*tw;cx.fillStyle='rgba('+sc+','+a+')';cx.beginPath();cx.arc(s.x,s.y,s.r*(.7+.5*tw),0,6.283);cx.fill();
  if(s.r>1.45){cx.strokeStyle='rgba('+sc+','+a*.7+')';cx.lineWidth=.8;const l=s.r*4*tw;cx.beginPath();cx.moveTo(s.x-l,s.y);cx.lineTo(s.x+l,s.y);cx.moveTo(s.x,s.y-l);cx.lineTo(s.x,s.y+l);cx.stroke()}}
 if(dk&&!RM){if(!shoot&&--nextShoot<=0){shoot={x:rnd(W*.2,W),y:rnd(0,H*.4),vx:-rnd(7,11),vy:rnd(3,5),life:60};nextShoot=rnd(260,620)}
  if(shoot){const g=cx.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.vx*7,shoot.y-shoot.vy*7);g.addColorStop(0,'rgba(255,255,255,'+shoot.life/60+')');g.addColorStop(1,'rgba(255,255,255,0)');cx.strokeStyle=g;cx.lineWidth=2;cx.beginPath();cx.moveTo(shoot.x,shoot.y);cx.lineTo(shoot.x-shoot.vx*7,shoot.y-shoot.vy*7);cx.stroke();shoot.x+=shoot.vx;shoot.y+=shoot.vy;if(--shoot.life<=0)shoot=null}}}
function loop(){drawSky();requestAnimationFrame(loop)}
try{const t=localStorage.getItem('vm_theme');if(t)root.dataset.theme=t}catch(e){}
const thIcon=()=>{$('#th').textContent=isDark()?'☀️':'🌙'};
$('#th').onclick=()=>{const n=isDark()?'light':'dark';root.dataset.theme=n;try{localStorage.setItem('vm_theme',n)}catch(e){}thIcon();if(RM)drawSky()};
thIcon();addEventListener('resize',sizeSky);sizeSky();if(!RM)loop();
const muI=()=>{$('#mu').textContent=MUTE?'🔇':'🔊'};$('#mu').onclick=()=>{MUTE=!MUTE;try{localStorage.setItem('vm_mute',MUTE?'1':'0')}catch(e){}muI();if(!MUTE)sfx.ok()};muI();

</script></body></html>
